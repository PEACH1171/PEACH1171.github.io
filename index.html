<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장스웨이 | Vision Designer Portfolio</title>
    <style>
        /* ===== 기본 리셋 및 변수 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 굵은 원체(粗圆体) 폰트 적용 */
        body {
            font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Nanum Gothic', sans-serif;
            font-weight: bold;
            background-color: var(--white);
            color: var(--dark);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* 제목에 더 강조된 굵은 원체 적용 */
        h1, h2, h3, .hero-title, .hero-subtitle, .project-title, .skill-name, .nav-links a, .logo {
            font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Nanum Gothic', sans-serif;
            font-weight: 900; /* 더 굵게 */
        }

        :root {
            /* 레트로 빈티지 색상 테마 */
            --primary: #D84315;
            --secondary: #F57C00;
            --accent: #FFA726;
            --light: #FFE0B2;
            --dark: #3E2723;
            --white: #FFFEF7;
        }

        /* 나머지 CSS 코드는 동일하게 유지... */
    </style>
    
    <!-- Google Fonts - Noto Sans KR (굵은 원체 계열) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 나머지 HTML 코드는 동일하게 유지... -->
</body>
</html>
</body>
</html>
